const save=()=>{try{localStorage.setItem(localeKey,JSON.stringify(state))}catch(_){}};
const av=(person,cls='')=>`<div class="avatar ${cls} ${person.online?'online':''}" style="--av1:${e(person.a||'#8d5bc9')};--av2:${e(person.b||'#d884ba')}" aria-hidden="true">${person.me&&state.profile.avatarData?`<img src="${e(state.profile.avatarData)}" alt="" style="width:100%;height:100%;object-fit:cover"/>`:e(person.initial||'✦')}</div>`;
const root=document.getElementById('root');
let modal=null,pendingAvatar=null;
const navs=[['home','home'],['messages','message'],['discover','sparkles'],['moments','camera'],['circles','users'],['calls','phone'],['profile','user']];
const nav=(small=false)=>`<nav class="${small?'mobile-nav':'rail-nav'}" aria-label="${t('more')}">${(small?navs.filter(x=>['home','messages','discover','moments','profile'].includes(x[0])):navs).map(([id,ico])=>`<button class="nav-item ${state.tab===id?'active':''}" data-action="nav" data-tab="${id}" aria-label="${t(id)}" ${state.tab===id?'aria-current="page"':''}>${I(ico)}<span>${t(id)}</span></button>`).join('')}${small?`<button class="nav-item" data-action="more-menu">${I('more')}<span>${t('more')}</span></button>`:''}</nav>`;
const langSelect=(extra='')=>`<select class="select-sm ${extra}" data-change="language" aria-label="${t('lang')}"><option value="ar" ${state.language==='ar'?'selected':''}>العربية</option><option value="en" ${state.language==='en'?'selected':''}>English</option><option value="fr" ${state.language==='fr'?'selected':''}>Français</option></select>`;
function renderAuth(){root.innerHTML=`<main class="auth-wrap"><section class="auth-art"><div class="brand"><div class="logo">${I('sparkles','ico-lg')}</div><span>وصلة <b>Wasla</b></span></div><div class="auth-hero"><span class="eyebrow">${t('authTag')}</span><h1>${t('newWay').replace('،','،<br>')}</h1><p>${t('authSubtitle')}</p><div class="orbit"><div class="orbit-head"><span class="signal"></span><b>${t('yourCircle')}</b><span class="small" style="margin-inline-start:auto;opacity:.6">● ● ●</span></div><div class="orbit-bottom"><div class="orbit-avatars">${people.slice(0,4).map(p=>av(p)).join('')}</div><div class="orbit-note">${t('focusTitle')}</div></div></div></div><footer class="auth-foot"><span>✦ ${t('authFoot')}</span><span>© Wasla 2026</span></footer></section><section class="auth-panel"><div class="auth-controls">${langSelect()}<button class="icon-btn" data-action="theme" title="${t('appearance')}" aria-label="${t('appearance')}">${I(state.light?'moon':'sun')}</button></div><div class="auth-card"><div class="eyebrow" style="margin-bottom:12px">WASLA / NEBULA</div><h2>${t('hello')}</h2><p class="subtitle">${state.authMode==='login'?t('loginSubtitle'):t('signupSubtitle')}</p><div class="switcher"><button data-action="auth-tab" data-mode="login" class="${state.authMode==='login'?'active':''}">${t('login')}</button><button data-action="auth-tab" data-mode="signup" class="${state.authMode==='signup'?'active':''}">${t('signup')}</button></div><form id="authForm" class="auth-form" novalidate>${state.authMode==='signup'?`<div class="field"><label for="fullName">${t('fullName')}</label><input id="fullName" name="fullName" autocomplete="name" minlength="2" required placeholder="${t('fullName')}" /></div>`:''}<div class="field"><label for="email">${t('email')}</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com" /></div><div class="field"><label for="password">${t('password')}</label><div class="input-icon"><input id="password" type="password" name="password" autocomplete="${state.authMode==='login'?'current-password':'new-password'}" minlength="6" required placeholder="••••••••" /><button type="button" data-action="show-password" aria-label="${t('password')}">${I('eye')}</button></div></div>${state.authMode==='signup'?`<div class="field"><label for="confirmPassword">${t('confirmPass')}</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="6" autocomplete="new-password" required placeholder="••••••••" /></div>`:''}${state.authMode==='login'?`<div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><label class="legal"><input type="checkbox" name="remember" checked />${t('remember')}</label><button class="link" type="button" data-action="forgot">${t('forgot')}</button></div>`:''}<label class="legal"><input type="checkbox" name="legal" id="legal" ${state.authMode==='signup'?'required':''} /><span>${t('accept')} <button type="button" class="link" data-action="policy">${t('terms')}</button> ${t('and')} <button type="button" class="link" data-action="policy">${t('privacy')}</button></span></label><button class="btn btn-primary btn-full" type="submit">${I(state.authMode==='login'?'arrow':'sparkles','ico-sm')}${t(state.authMode==='login'?'loginSubmit':'signupSubmit')}</button><div class="auth-separator">${t('or')}</div><button class="btn google btn-full" type="button" data-action="google"><span class="google-g">G</span>${t('google')}</button><button class="btn btn-ghost btn-full" type="button" data-action="demo">${I('sparkles','ico-sm')}${t('demo')}</button></form><p class="auth-disclaimer">${t('demoDisclaimer')}</p></div></section></main>`}
function renderShell(){const labels={home:t('mySpace'),messages:t('messages'),discover:t('discover'),moments:t('moments'),circles:t('circles'),calls:t('calls'),profile:t('profileTitle')};root.innerHTML=`<div class="app-shell"><aside class="rail"><button class="logo" data-action="nav" data-tab="home" aria-label="Wasla">${I('sparkles','ico-lg')}</button>${nav()}<div class="rail-bottom"><button class="icon-btn plain" data-action="theme" aria-label="${t('theme')}">${I(state.light?'moon':'sun')}</button><button class="icon-btn plain" data-action="policy" aria-label="${t('security')}">${I('shield')}</button><button data-action="nav" data-tab="profile" style="padding:0;background:none" aria-label="${t('profile')}">${av({me:true,initial:(state.profile.name||'و').slice(0,1),a:'#9464df',b:'#dd90ba'})}</button></div></aside><div class="workspace"><header class="topbar"><div class="topbar-title"><h2>وصلة <span style="color:var(--purple3);font-weight:500">/ ${labels[state.tab]}</span></h2><p>${t('homeNote')}</p></div><div class="top-actions"><span class="online-pill"><i class="signal"></i>${t('online')}</span>${langSelect()}<button class="icon-btn" data-action="nav" data-tab="calls" aria-label="${t('calls')}">${I('phone')}</button><button class="icon-btn" data-action="nav" data-tab="profile" aria-label="${t('profile')}">${I('user')}</button></div></header>${state.tab==='messages'?renderMessages():`<main class="page limit">${renderPage()}</main>`}</div></div>${nav(true)}`}
const section=(title,action='',actionTab='')=>`<div class="section-title"><h3>${title}</h3>${action?`<button class="link-btn" data-action="${action==='nav'?'nav':action}" ${action==='nav'?`data-tab="${actionTab}"`:''}>${t('viewAll')}${I('arrow','ico-sm')}</button>`:''}</div>`;
const pageTitle=(title,desc,buttonLabel='',action='')=>`<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${buttonLabel?`<button class="btn btn-primary btn-sm" data-action="${action}">${I('plus','ico-sm')}${buttonLabel}</button>`:''}</div>`;
function renderPage(){switch(state.tab){case'home':return renderHome();case'discover':return renderDiscover();case'moments':return renderMoments();case'circles':return renderCircles();case'calls':return renderCalls();case'profile':return renderProfile();default:return renderHome()}}
function renderHome(){return `<div class="grid two"><div class="stack"><section class="hero"><div class="hero-copy"><span class="eyebrow">YOUR SPACE, REIMAGINED</span><h2>${t('welcomeBack')}، ${e((state.profile.name||'').split(' ')[0])} ✦</h2><p>${t('welcomeCopy')}</p><div class="hero-tags"><button class="btn btn-primary btn-sm" data-action="nav" data-tab="messages">${I('message','ico-sm')}${t('startChat')}</button><button class="btn btn-outline btn-sm" data-action="new-moment">${I('plus','ico-sm')}${t('createMoment')}</button></div></div></section><section class="section-gap">${section(t('quickActions'))}<div class="grid three">${[['message','featureChats','featureChatsD','messages'],['camera','featureMoments','featureMomentsD','moments'],['users','featureCircle','featureCircleD','circles']].map(([icon,title,copy,tab])=>`<button class="surface feature" style="text-align:start;color:var(--text)" data-action="nav" data-tab="${tab}"><div class="feature-icon">${I(icon,'ico-lg')}</div><div><h3>${t(title)}</h3><p>${t(copy)}</p></div></button>`).join('')}</div></section><section class="section-gap">${section(t('yourHighlights'),'nav','moments')}<div class="story-strip"><button class="story-small" data-action="new-moment">${av({initial:'+',a:'#6750a8',b:'#ab81f0'})}<div><p>${t('yourMoment')}</p><small>${t('createMoment')}</small></div></button>${moments.slice(0,4).map(m=>`<button class="story-small" data-action="view-moment" data-id="${m.id}">${av(m,'story-ring')}<div class="ellipsis"><p class="ellipsis">${e(m.person)}</p><small>${e(m.time)}</small></div></button>`).join('')}</div></section></div><div class="stack"><section class="surface" style="padding:19px 20px">${section(t('latest'),'nav','messages')}<div>${people.slice(0,4).map(p=>`<button class="list-row" data-action="open-chat" data-id="${p.id}" style="width:100%;text-align:start;background:none;color:var(--text)">${av(p)}<div class="grow"><h4>${e(p.name)}</h4><p class="ellipsis">${e(latestMessage(p).text||p.snippet)}</p></div><time>${e(p.time)}</time></button>`).join('')}</div></section><section class="surface" style="padding:21px"><div class="eyebrow">WASLA CIRCLES</div><h3 style="margin:10px 0;font-size:20px">${t('focusTitle')}</h3><p class="soft" style="font-size:12px;margin-bottom:17px">${t('focusDesc')}</p><button class="btn btn-soft btn-full" data-action="nav" data-tab="circles">${I('users','ico-sm')}${t('exploreCircles')}</button></section><div class="statrow"><div class="stat surface"><strong>${people.length}</strong><p>${t('connections')}</p></div><div class="stat surface"><strong>${state.joined.length}</strong><p>${t('circles')}</p></div><div class="stat surface"><strong>${state.ownMoments.length}</strong><p>${t('posts')}</p></div></div></div></div>`}
function getMessages(id){return [...(seedMessages[id]||[]),...((state.messages||{})[id]||[])]}
function latestMessage(p){return getMessages(p.id).slice(-1)[0]||{text:p.snippet}}
function renderMessages(){let entries=people.filter(p=>(state.filter==='all'||(state.filter==='unread'?p.unread>0:state.filter==='pinned'?p.pinned:!!p.group))&&(!state.search||p.name.includes(state.search)||p.about.toLowerCase().includes(state.search.toLowerCase())));const p=people.find(x=>x.id===state.chatId);const messages=p?getMessages(p.id):[];return `<section class="messages-shell ${state.mobileChat?'chat-open':''}"><aside class="inbox"><div class="inbox-head"><h2>${t('messages')}</h2><button class="icon-btn" data-action="nav" data-tab="discover" aria-label="${t('startChat')}">${I('plus')}</button></div><div class="searchbox">${I('search')}<input type="search" data-input="chat-search" value="${e(state.search)}" placeholder="${t('searchChats')}" aria-label="${t('searchChats')}" /></div><div class="filter-bar">${[['all','all'],['unread','unread'],['pinned','pinned'],['groups','groups']].map(([id,label])=>`<button class="${state.filter===id?'active':''}" data-action="filter" data-filter="${id}">${t(label)}</button>`).join('')}</div>${entries.length?entries.map(c=>`<button class="contact ${state.chatId===c.id?'active':''}" data-action="open-chat" data-id="${c.id}">${av(c,'large')}<div class="contact-main"><div class="contact-name"><span class="ellipsis">${e(c.name)}</span><time>${e(c.time)}</time></div><div class="contact-sub"><span class="ellipsis">${e(latestMessage(c).text)}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div></div></button>`).join(''):`<p class="muted" style="padding:20px;text-align:center">${t('notFound')}</p>`}</aside><section class="chat">${p?`<div class="chat-head"><button class="icon-btn plain" data-action="back-chat" aria-label="${t('messages')}">${I('back')}</button>${av(p)}<div class="who"><h3 class="ellipsis">${e(p.name)}</h3><p>${p.online?`${t('activeNow')} ✦`:e(p.about)}</p></div><button class="icon-btn plain" data-action="call" data-id="${p.id}" data-type="audio" title="${t('audioCall')}">${I('phone')}</button><button class="icon-btn plain" data-action="call" data-id="${p.id}" data-type="video" title="${t('videoCall')}">${I('video')}</button><button class="icon-btn plain" data-action="chat-info" title="${t('aboutMe')}">${I('more')}</button></div><div class="chat-stage" id="chatStage"><div class="day-divider">${t('today')}</div>${messages.map(m=>`<div class="bubble ${m.mine?'mine':''}"><span>${e(m.text)}</span><time>${e(m.time)}</time></div>`).join('')}</div><form id="chatForm" class="chat-compose"><button class="icon-btn plain" type="button" data-action="attach" title="${t('attach')}">${I('paperclip')}</button><button class="icon-btn plain" type="button" data-action="emoji" title="Emoji">${I('smile')}</button><input type="text" id="messageInput" autocomplete="off" placeholder="${t('writeMessage')}" aria-label="${t('writeMessage')}" maxlength="4000"/><button class="btn btn-primary" type="submit" aria-label="${t('sendSuccess')}">${I('send')}</button></form>`:`<div class="empty-chat"><div class="big">${I('message','ico-lg')}</div><h3>${t('selectChat')}</h3><p>${t('selectChatDesc')}</p></div>`}</section></section>`}
function renderDiscover(){const q=(state.peopleSearch||'').toLowerCase();const found=people.filter(p=>!p.group&&(!q||p.name.toLowerCase().includes(q)||p.about.toLowerCase().includes(q)));return `${pageTitle(t('peopleTitle'),t('peopleDesc'))}<div class="searchbox" style="max-width:530px;margin-bottom:23px">${I('search')}<input type="search" data-input="people-search" value="${e(state.peopleSearch)}" placeholder="${t('searchPeople')}" aria-label="${t('searchPeople')}" /></div><div class="people-grid">${found.map(p=>`<article class="surface person">${av(p,'large')}<h3>${e(p.name)}</h3><p>${e(p.about)}<br>@${e(p.id+'.wasla')}</p><div class="chipline" style="justify-content:center">${p.interests.map(i=>`<span class="tag">${e(i)}</span>`).join('')}</div><div style="width:100%;display:flex;gap:6px;margin-top:auto"><button class="btn btn-soft btn-sm" style="flex:1" data-action="follow" data-id="${p.id}">${I(state.followed.includes(p.id)?'check':'plus','ico-sm')}${t(state.followed.includes(p.id)?'following':'connect')}</button><button class="btn btn-primary btn-sm" style="flex:1" data-action="open-chat" data-id="${p.id}">${I('message','ico-sm')}${t('sayHello')}</button></div></article>`).join('')}</div>${!found.length?`<p class="muted">${t('notFound')}</p>`:''}`}
function renderMoments(){const own=state.ownMoments.map((m,i)=>({id:'own'+i,person:state.profile.name,initial:(state.profile.name||'و').slice(0,1),a:'#9160d1',b:'#d582bc',text:m.text,time:t('today'),m1:'#9251ad',m2:'#452962'}));return `${pageTitle(t('momentTitle'),t('momentDesc'),t('newMoment'),'new-moment')}<div class="moments-grid"><button class="moment" data-action="new-moment" style="--m1:#3e285b;--m2:#261a3e;align-items:center;justify-content:center;gap:13px;border:1px dashed rgba(200,167,255,.38)"><div class="feature-icon" style="width:62px;height:62px;border-radius:22px;color:#ddd0ff">${I('plus','ico-lg')}</div><strong style="font-size:17px">${t('createMoment')}</strong><small>${t('yourMoment')}</small></button>${[...own,...moments].map(m=>`<button class="moment" style="--m1:${e(m.m1)};--m2:${e(m.m2)}" data-action="view-moment" data-id="${e(m.id)}"><div style="display:flex;gap:10px;align-items:center">${av(m)}<div><b style="font-size:12px">${e(m.person)}</b><br><small>${e(m.time)}</small></div></div><strong>${e(m.text)}</strong><small>${I('eye','ico-sm')} WASLA STORY</small></button>`).join('')}</div>`}
function renderCircles(){const all=[...circles,...state.ownCircles.map((x,i)=>({id:'ownc'+i,name:x.name,description:x.description,members:1,icon:'users',m1:'#6840aa',m2:'#30244a',kind:'community'}))];return `${pageTitle(t('circleTitle'),t('circleDesc'),t('newCircle'),'new-circle')}<div class="circles-grid">${all.map(c=>`<article class="surface circle"><div class="circle-art" style="--m1:${c.m1};--m2:${c.m2}">${I(c.icon)}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:7px"><h3>${e(c.name)}</h3><span class="tag">${t(c.kind==='channel'?'channel':'community')}</span></div><p>${e(c.description)}</p><div class="circle-foot"><span>${c.members} ${t('members')}</span><button class="btn ${state.joined.includes(c.id)?'btn-soft':'btn-primary'} btn-sm" data-action="join-circle" data-id="${e(c.id)}">${I(state.joined.includes(c.id)?'check':'plus','ico-sm')}${t(state.joined.includes(c.id)?'joined':'join')}</button></div></article>`).join('')}</div>`}
function renderCalls(){return `${pageTitle(t('callsTitle'),t('callsDesc'))}<div class="grid two"><section class="surface"><div class="call-list">${callLog.map(c=>{const p=people.find(x=>x.id===c.id);return `<div class="call-item">${av(p,'large')}<div class="info"><h3>${e(p.name)}</h3><p><span style="color:${c.type==='missed'?'#ef93ca':'var(--purple3)'}">${t(c.type)}</span> · ${e(c.time)}</p></div><button class="icon-btn" data-action="call" data-id="${c.id}" data-type="${c.video?'video':'audio'}" aria-label="${t(c.video?'videoCall':'audioCall')}">${I(c.video?'video':'phone')}</button></div>`}).join('')}</div></section><section class="surface" style="padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:15px;min-height:230px"><div class="feature-icon" style="width:65px;height:65px;border-radius:22px">${I('phone','ico-lg')}</div><h3>${t('callsTitle')}</h3><p class="soft" style="font-size:12px;max-width:280px">${t('noCalls')}</p><button class="btn btn-soft" data-action="nav" data-tab="discover">${I('users','ico-sm')}${t('discover')}</button></section></div>`}
const toggle=(key,title,icon,desc='')=>`<div class="settings-row">${I(icon)}<div class="grow"><strong>${title}</strong>${desc?`<p>${desc}</p>`:''}</div><button class="toggle ${state.prefs[key]?'on':''}" data-action="toggle-pref" data-key="${key}" role="switch" aria-checked="${state.prefs[key]}" aria-label="${title}"><i></i></button></div>`;
function renderProfile(){return `${pageTitle(t('profileTitle'),t('profileDesc'))}<div class="profile-layout"><div class="stack"><section class="surface profile-main"><div class="cover ${e(state.profile.cover)}"><span class="cover-label">✦ WASLA SPACE</span></div><div class="profile-details"><div class="profile-intro">${av({me:true,initial:(state.profile.name||'و').slice(0,1),a:'#9763e6',b:'#d583bb'},'xl')}<button class="btn btn-primary btn-sm" data-action="edit-profile">${I('edit','ico-sm')}${t('editProfile')}</button></div><h2 class="profile-name">${e(state.profile.name)}</h2><p class="profile-handle" dir="ltr" style="text-align:start">@${e(state.profile.handle)}</p><div class="chipline" style="margin-top:12px"><span class="pill good"><span class="signal"></span>${t('statusHere')}</span><span class="pill">${I('shield','ico-sm')}${t('security')}</span></div><p class="profile-bio">${e(state.profile.bio)}</p><div class="chipline">${state.profile.interest.split(/[•,،]/).map(i=>i.trim()).filter(Boolean).slice(0,7).map(i=>`<span class="tag">${e(i)}</span>`).join('')}</div><div class="profile-insights"><div><strong>${state.followed.length}</strong><span>${t('followers')}</span></div><div><strong>${people.length}</strong><span>${t('connections')}</span></div><div><strong>${state.ownMoments.length}</strong><span>${t('posts')}</span></div></div><div class="chipline" style="margin-top:20px"><button class="btn btn-soft" data-action="share-profile">${I('copy','ico-sm')}${t('shareProfile')}</button><button class="btn btn-soft" data-action="new-moment">${I('plus','ico-sm')}${t('createMoment')}</button></div></div></section><section class="surface side-card"><h3>${t('favoriteInterests')}</h3><div class="chipline">${state.profile.interest.split(/[•,،]/).map(i=>i.trim()).filter(Boolean).map(i=>`<span class="tag"># ${e(i)}</span>`).join('')}</div></section></div><div class="stack"><section class="surface side-card"><h3>${t('preferences')}</h3><div class="settings-row">${I('globe')}<span class="grow"><strong>${t('lang')}</strong></span>${langSelect()}</div><div class="settings-row">${I('moon')}<span class="grow"><strong>${t('theme')}</strong></span><button class="toggle ${state.light?'on':''}" data-action="theme" role="switch" aria-checked="${state.light}" aria-label="${t('theme')}"><i></i></button></div><div class="settings-row">${I('sparkles')}<span class="grow"><strong>${t('color')}</strong></span><div class="theme-options"><button class="theme-opt ${state.accent==='violet'?'chosen':''}" data-action="accent" data-color="violet" aria-label="${t('coverViolet')}"></button><button class="theme-opt rose ${state.accent==='pink'?'chosen':''}" data-action="accent" data-color="pink" aria-label="${t('coverRose')}"></button><button class="theme-opt indigo ${state.accent==='indigo'?'chosen':''}" data-action="accent" data-color="indigo" aria-label="${t('coverIndigo')}"></button></div></div><div class="settings-row">${I('camera')}<span class="grow"><strong>${t('cover')}</strong></span><select class="select-sm" data-change="cover"><option value="violet" ${state.profile.cover==='violet'?'selected':''}>${t('coverViolet')}</option><option value="rose" ${state.profile.cover==='rose'?'selected':''}>${t('coverRose')}</option><option value="indigo" ${state.profile.cover==='indigo'?'selected':''}>${t('coverIndigo')}</option></select></div></section><section class="surface side-card"><h3>${t('security')}</h3>${toggle('lastSeen',t('lastSeen'),'eye')}${toggle('readReceipts',t('readReceipts'),'check')}${toggle('notifications',t('notifications'),'bell')}${toggle('dataSaver',t('dataSaver'),'wifi')}<button class="btn btn-soft btn-full" style="margin-top:15px" data-action="policy">${I('shield','ico-sm')}${t('privacy')}</button></section><section class="surface side-card"><h3>${t('account')}</h3><div class="profile-links"><button data-action="export">${I('download')}${t('exportData')}</button><button data-action="reset">${I('archive')}${t('clearDemo')}</button><button data-action="forgot">${I('lock')}${t('changePassword')}</button><button data-action="signout" style="color:#ec99bd">${I('logout')}${t('signout')}</button></div><p class="muted" style="font-size:10px;margin-top:12px">${t('privateNote')}</p></section></div></div>`}
function toast(message){const n=document.createElement('div');n.className='toast';n.innerHTML=`${I('sparkles','ico-sm')}<span>${e(message)}</span>`;document.getElementById('toastWrap').append(n);setTimeout(()=>n.remove(),3600)}
function modalContent(){if(!modal)return '';const head=(title)=>`<div class="modal-head"><h2>${title}</h2><button type="button" class="icon-btn plain" data-action="close-modal" aria-label="${t('close')}">${I('x')}</button></div>`;
let body='',wide=false;
switch(modal.type){case'policy':wide=true;body=`${head(t('privacyHeading'))}<div class="legal-copy"><h3>${t('privacy')}</h3><p>${t('privacyText')}</p><h3>${t('terms')}</h3><p>${t('termsText')}</p><h3>${t('privateNote')}</h3><p>Wasla Nebula V2 — UI concept, local demo only.</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">${t('close')}</button></div>`;break;
case'google':body=`${head(t('google'))}<div class="modal-body"><div class="feature-icon" style="width:56px;height:56px"><span class="google-g">G</span></div><p>${t('googleHint')}</p><p class="muted small">Supabase Auth → Providers → Google → OAuth redirect URLs</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">${t('close')}</button></div>`;break;
case'forgot':body=`${head(t('requestReset'))}<form id="forgotForm" class="modal-body"><p class="muted">${t('forgotHint')}</p><div class="field"><label for="resetEmail">${t('email')}</label><input id="resetEmail" name="email" type="email" required placeholder="you@example.com"></div><button type="submit" class="btn btn-primary btn-full">${t('requestReset')}</button></form>`;break;
case'moment':body=`${head(t('newMoment'))}<form id="momentForm" class="modal-body"><div class="field"><label for="momentText">${t('momentText')}</label><textarea name="text" id="momentText" maxlength="220" required placeholder="✦ ${t('momentText')}"></textarea><p class="field-hint">220 max</p></div><button class="btn btn-primary btn-full" type="submit">${I('sparkles','ico-sm')}${t('publish')}</button></form>`;break;
case'circle':body=`${head(t('newCircle'))}<form id="circleForm" class="modal-body"><div class="field"><label for="circleName">${t('circleName')}</label><input id="circleName" name="name" required minlength="3" maxlength="42" /></div><div class="field"><label for="circleDescription">${t('circleDescField')}</label><textarea id="circleDescription" name="description" required maxlength="160"></textarea></div><button class="btn btn-primary btn-full" type="submit">${t('create')}</button></form>`;break;
case'profile':body=`${head(t('editProfile'))}<form id="profileForm" class="modal-body"><div style="display:flex;align-items:center;gap:12px">${av({me:true,initial:(state.profile.name||'و').slice(0,1),a:'#9464df',b:'#d88dbb'},'large')}<label class="btn btn-soft btn-sm" style="cursor:pointer">${I('camera','ico-sm')}${t('editProfile')}<input type="file" id="profilePhoto" accept="image/*" style="display:none" /></label></div><div class="field"><label for="editName">${t('name')}</label><input id="editName" name="name" required minlength="2" maxlength="45" value="${e(state.profile.name)}" /></div><div class="field"><label for="editHandle">${t('handle')}</label><input id="editHandle" name="handle" dir="ltr" minlength="3" maxlength="24" required pattern="[A-Za-z0-9._]+" value="${e(state.profile.handle)}" /></div><div class="field"><label for="editBio">${t('bio')}</label><textarea id="editBio" name="bio" maxlength="180">${e(state.profile.bio)}</textarea></div><div class="field"><label for="editInterests">${t('interests')}</label><input id="editInterests" name="interest" maxlength="130" value="${e(state.profile.interest)}" /></div><button class="btn btn-primary btn-full" type="submit">${I('check','ico-sm')}${t('save')}</button></form>`;break;
case'story':{const all=[...state.ownMoments.map((m,i)=>({id:'own'+i,person:state.profile.name,text:m.text,time:t('today'),m1:'#9251ad',m2:'#452962'})),...moments];const m=all.find(x=>x.id===modal.id);body=`${head(t('moments'))}<div style="min-height:310px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;border-radius:18px;color:white;background:linear-gradient(140deg,${e(m?.m1||'#5e328a')},${e(m?.m2||'#261b42')})"><div><span class="eyebrow">WASLA / MOMENT</span><h3 style="font-size:17px;margin-top:7px">${e(m?.person||'')}</h3><small>${e(m?.time||'')}</small></div><h2 style="font-size:26px">${e(m?.text||'')}</h2><div class="chipline"><span class="pill">${I('heart','ico-sm')} ${t('moments')}</span></div></div>`;break;}
case'chatinfo':{const p=people.find(x=>x.id===state.chatId);body=`${head(t('aboutMe'))}<div style="text-align:center;padding:22px">${p?`<div style="display:flex;justify-content:center">${av(p,'xl')}</div><h3 style="margin:14px 0 4px">${e(p.name)}</h3><p class="muted">${e(p.about)}</p>`:''}</div><button class="btn btn-soft btn-full" data-action="close-modal">${t('close')}</button>`;break;}
case'more':body=`${head(t('more'))}<div class="modal-body">${[['circles','users'],['calls','phone'],['profile','user'],['discover','sparkles']].map(([tab,ico])=>`<button data-action="nav" data-tab="${tab}" class="btn btn-soft btn-full" style="justify-content:flex-start">${I(ico)}${t(tab)}</button>`).join('')}</div>`;break;
case'call':body=`${head(t(modal.callType==='video'?'videoCall':'audioCall'))}<div class="modal-body" style="align-items:center;text-align:center;padding:15px 0">${av(people.find(p=>p.id===modal.id)||{initial:'✦'},'xl')}<h3>${e((people.find(p=>p.id===modal.id)||{}).name||'')}</h3><p class="muted">${t('callUnavailable')}</p></div><div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">${t('close')}</button></div>`;break;
case'attach':body=`${head(t('attach'))}<div class="modal-body"><label class="btn btn-soft btn-full" style="cursor:pointer">${I('file')}${t('attach')}<input id="attachmentInput" type="file" style="display:none" /></label><p class="muted small">${t('actionDemo')}</p></div>`;break;
default:body=head(t('more'));
}
return `<div class="modal-backdrop" id="modalBackdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${e(modal.type)}">${body}</section></div>`}
function setModal(type,other={}){modal={type,...other};renderModal()}
function renderModal(){document.getElementById('modalBackdrop')?.remove();if(modal){document.body.insertAdjacentHTML('beforeend',modalContent());requestAnimationFrame(()=>document.querySelector('#modalBackdrop button')?.focus())}}
function render(opts={}){document.documentElement.lang=state.language;document.documentElement.dir=state.language==='ar'?'rtl':'ltr';document.body.className=`${state.light?'light':''} ${state.accent==='pink'?'pink':state.accent==='indigo'?'indigo':''}`;document.querySelector('meta[name="theme-color"]').setAttribute('content',state.light?'#eee9f5':'#100d1c');state.loggedIn?renderShell():renderAuth();renderModal();if(state.loggedIn&&state.tab==='messages'){const node=document.getElementById('chatStage');if(node)node.scrollTop=node.scrollHeight}save()}
function enterDemo(){state.loggedIn=true;state.tab='home';modal=null;render();toast(t('authHint'))}
function addMessage(id,txt){const time=new Date().toLocaleTimeString(state.language==='ar'?'ar-MA':state.language==='fr'?'fr-FR':'en-US',{hour:'2-digit',minute:'2-digit'});(state.messages[id]??=[]).push({mine:true,text:txt,time});const p=people.find(x=>x.id===id);if(p){p.time=time;p.unread=0}render()}
const actions={
'nav':el=>{state.tab=el.dataset.tab;state.mobileChat=false;modal=null;render()},'theme':()=>{state.light=!state.light;render()},'auth-tab':el=>{state.authMode=el.dataset.mode;render()},'demo':enterDemo,'google':()=>setModal('google'),'forgot':()=>setModal('forgot'),'policy':()=>setModal('policy'),'close-modal':()=>{modal=null;renderModal()},'show-password':el=>{const input=document.getElementById('password');if(input){input.type=input.type==='password'?'text':'password';el.innerHTML=I(input.type==='password'?'eye':'eyeoff')}},'filter':el=>{state.filter=el.dataset.filter;render()},'open-chat':el=>{state.tab='messages';state.chatId=el.dataset.id;state.mobileChat=true;const p=people.find(x=>x.id===state.chatId);if(p)p.unread=0;modal=null;render()},'back-chat':()=>{state.mobileChat=false;render()},'emoji':()=>{const input=document.getElementById('messageInput');if(input){input.value+=' ✨';input.focus()}},'attach':()=>setModal('attach'),'new-moment':()=>setModal('moment'),'new-circle':()=>setModal('circle'),'view-moment':el=>setModal('story',{id:el.dataset.id}),'follow':el=>{const id=el.dataset.id;state.followed=state.followed.includes(id)?state.followed.filter(x=>x!==id):[...state.followed,id];render()},'join-circle':el=>{const id=el.dataset.id;state.joined=state.joined.includes(id)?state.joined.filter(x=>x!==id):[...state.joined,id];render()},'call':el=>setModal('call',{id:el.dataset.id,callType:el.dataset.type}),'chat-info':()=>setModal('chatinfo'),'edit-profile':()=>{pendingAvatar=null;setModal('profile')},'share-profile':()=>{const url='@'+state.profile.handle;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast(t('copied'))).catch(()=>toast(t('profileShare')+' · '+url))}else toast(t('profileShare')+' · '+url)},'toggle-pref':el=>{state.prefs[el.dataset.key]=!state.prefs[el.dataset.key];render()},'accent':el=>{state.accent=el.dataset.color;render()},'more-menu':()=>setModal('more'),'export':()=>{const out=JSON.stringify({waslaPreview:true,exportedAt:new Date().toISOString(),profile:state.profile,preferences:state.prefs,messages:state.messages,moments:state.ownMoments,circles:state.ownCircles},null,2);const blob=new Blob([out],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='wasla-preview-data.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'reset':()=>{if(confirm(t('clearConfirm'))){const language=state.language;state=clone(defaults);state.language=language;render()}},'signout':()=>{state.loggedIn=false;state.tab='home';state.mobileChat=false;render();toast(t('signedOut'))}};
document.addEventListener('click',event=>{if(event.target.id==='modalBackdrop'){modal=null;renderModal();return}const el=event.target.closest('[data-action]');if(!el)return;const action=actions[el.dataset.action];if(action){event.preventDefault();action(el)}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.change==='language'){state.language=el.value;render();return}if(el.dataset.change==='cover'){state.profile.cover=el.value;render();return}if(el.id==='profilePhoto'&&el.files?.[0]){const f=el.files[0];if(!f.type.startsWith('image/')||f.size>5000000){toast(t('actionDemo'));return}const pic=new Image();const temp=URL.createObjectURL(f);pic.onload=()=>{const canvas=document.createElement('canvas');canvas.width=220;canvas.height=220;const cx=canvas.getContext('2d');const r=Math.min(pic.width,pic.height),sx=(pic.width-r)/2,sy=(pic.height-r)/2;cx.drawImage(pic,sx,sy,r,r,0,0,220,220);pendingAvatar=canvas.toDataURL('image/jpeg',.78);URL.revokeObjectURL(temp);const prev=document.querySelector('#profileForm .avatar');if(prev)prev.innerHTML=`<img src="${pendingAvatar}" alt="" style="width:100%;height:100%;object-fit:cover"/>`};pic.onerror=()=>{URL.revokeObjectURL(temp);toast(t('actionDemo'))};pic.src=temp;return}if(el.id==='attachmentInput'&&el.files?.[0]){const f=el.files[0];const name=f.name.slice(0,100);const id=state.chatId;modal=null;addMessage(id,'📎 '+name);toast(t('sendFile'))}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='chat-search'||el.dataset.input==='people-search'){const key=el.dataset.input==='chat-search'?'search':'peopleSearch';state[key]=el.value;const cursor=el.selectionStart;render();const n=document.querySelector(`[data-input="${el.dataset.input}"]`);if(n){n.focus({preventScroll:true});try{n.setSelectionRange(cursor,cursor)}catch(_){}}}});
document.addEventListener('submit',event=>{const form=event.target;if(!['authForm','chatForm','forgotForm','momentForm','circleForm','profileForm'].includes(form.id))return;event.preventDefault();const fd=new FormData(form);if(form.id==='authForm'){const email=(fd.get('email')||'').toString().trim(),password=(fd.get('password')||'').toString();if(!form.reportValidity()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||password.length<6){toast(t('emailHint'));return}if(state.authMode==='signup'){if(password!==(fd.get('confirmPassword')||'')){toast(t('passwordMismatch'));return}if(!fd.get('legal')){toast(t('mustAccept'));return}state.profile.name=(fd.get('fullName')||'').toString().trim().slice(0,45)||state.profile.name;state.profile.handle=email.split('@')[0].replace(/[^A-Za-z0-9._]/g,'').slice(0,24)||state.profile.handle;toast(t('accountCreated'))}else if(!fd.get('legal')){toast(t('mustAccept'));return}enterDemo();return}if(form.id==='chatForm'){const input=document.getElementById('messageInput');const value=input?.value.trim();if(value)addMessage(state.chatId,value);return}if(form.id==='forgotForm'){toast(t('forgotHint'));modal=null;renderModal();return}if(form.id==='momentForm'){const value=(fd.get('text')||'').toString().trim();if(value){state.ownMoments.unshift({text:value.slice(0,220)});modal=null;state.tab='moments';render();toast(t('newMomentSaved'))}return}if(form.id==='circleForm'){const name=(fd.get('name')||'').toString().trim(),description=(fd.get('description')||'').toString().trim();if(name&&description){state.joined.push('ownc'+state.ownCircles.length);state.ownCircles.push({name:name.slice(0,42),description:description.slice(0,160)});modal=null;state.tab='circles';render();toast(t('circleCreated'))}return}if(form.id==='profileForm'){const name=(fd.get('name')||'').toString().trim(),handle=(fd.get('handle')||'').toString().trim();if(name.length<2||!/^[A-Za-z0-9._]{3,24}$/.test(handle)){form.reportValidity();return}state.profile={...state.profile,...(pendingAvatar?{avatarData:pendingAvatar}:{}),name,handle,bio:(fd.get('bio')||'').toString().trim(),interest:(fd.get('interest')||'').toString().trim()};modal=null;render();toast(t('profileSaved'))}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){modal=null;renderModal()}else if(event.key==='Escape'&&state.tab==='messages'&&state.mobileChat){state.mobileChat=false;render()}});
render();
})();
